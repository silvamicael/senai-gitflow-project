name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and enforce coverage
        run: npm run test:coverage
      - name: Validate coverage report
        run: test -s coverage/lcov.info

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t git-workflow .
      - name: Run API container
        run: docker run -d --name git-workflow -p 3000:3000 git-workflow
      - name: Check API health endpoint
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          docker logs git-workflow
          exit 1
      - name: Stop API container
        if: always()
        run: docker rm -f git-workflow || true
